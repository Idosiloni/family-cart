<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a5a">
  <title>העגלה המשפחתית</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>

    <div class="hero-inner">
      <div class="hero-top">
        <p class="eyebrow">🛒 העגלה המשפחתית</p>
        <button id="share" type="button" class="share" aria-label="שתף קישור לעגלה">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
          <span>שתף</span>
        </button>
      </div>

      <div class="hero-main">
        <div class="hero-text">
          <h1 id="greeting">שלום!</h1>
          <p id="summary" class="summary"></p>
        </div>
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 84 84">
            <circle class="ring-bg" cx="42" cy="42" r="36"/>
            <circle id="ring-fg" class="ring-fg" cx="42" cy="42" r="36"/>
          </svg>
          <div class="ring-label"><b id="ring-num">0</b><small id="ring-of"></small></div>
        </div>
      </div>

      <button id="order-btn" type="button" class="order-btn">
        <span>🧭</span> סדר הסופר
      </button>
    </div>
  </header>

  <main>
    <p id="status" role="status"></p>

    <div id="empty" class="empty" hidden>
      <div class="empty-art" aria-hidden="true">
        <span class="e1">🥕</span><span class="e2">🥛</span><span class="e3">🍞</span><span class="e4">🍎</span>
        <div class="empty-cart">🛒</div>
      </div>
      <h2>העגלה מחכה למוצר הראשון</h2>
      <p>כתבו למטה מה חסר בבית.<br>כולם במשפחה יראו את זה מיד.</p>
    </div>

    <div id="list"></div>

    <section id="done-section" hidden>
      <div class="section-title">
        <h2>✓ כבר בעגלה <span id="done-count"></span></h2>
        <button id="clear-done" type="button" class="link">נקה הכול</button>
      </div>
      <ul id="done-list"></ul>
    </section>
  </main>

  <form id="add-form" class="add-bar" autocomplete="off">
    <input id="add-input" type="text" maxlength="80" placeholder="מה חסר בבית?" enterkeyhint="done" aria-label="שם המוצר" required>
    <button type="submit" aria-label="הוסף מוצר">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>

  <dialog id="picker">
    <h2 id="picker-title"></h2>
    <div id="picker-list"></div>
    <button type="button" class="link" data-close>ביטול</button>
  </dialog>

  <dialog id="order-dialog">
    <h2>🧭 סדר הסופר</h2>
    <p class="hint">סדרו לפי הסדר שבו עוברים בסופר שלכם. הרשימה תתעדכן לכולם.</p>
    <ul id="order-list"></ul>
    <div class="dialog-actions">
      <button type="button" class="link" id="order-reset">איפוס לברירת מחדל</button>
      <button type="button" data-close>סיום</button>
    </div>
  </dialog>

  <div id="confetti" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
