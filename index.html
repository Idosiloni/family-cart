<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <title>העגלה המשפחתית</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-top">
      <div>
        <p class="eyebrow">רשימת קניות</p>
        <h1>העגלה המשפחתית</h1>
      </div>
      <button id="share" type="button" class="share" aria-label="שתף קישור לעגלה">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        <span>שתף</span>
      </button>
    </div>
    <p id="summary" class="summary"></p>
    <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
  </header>

  <main>
    <p id="status" role="status"></p>

    <div id="empty" class="empty" hidden>
      <div class="empty-emoji">🛒</div>
      <h2>העגלה ריקה</h2>
      <p>הוסיפו את המוצר הראשון למטה.<br>כל המשפחה תראה אותו מיד.</p>
    </div>

    <ul id="list"></ul>

    <section id="done-section" hidden>
      <div class="section-title">
        <h2>בעגלה <span id="done-count"></span></h2>
        <button id="clear-done" type="button" class="link">נקה</button>
      </div>
      <ul id="done-list"></ul>
    </section>
  </main>

  <form id="add-form" class="add-bar" autocomplete="off">
    <input id="add-input" type="text" maxlength="80" placeholder="מה חסר בבית?" enterkeyhint="done" aria-label="שם המוצר" required>
    <button type="submit" aria-label="הוסף מוצר">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>

  <script type="module" src="app.js"></script>
</body>
</html>
