<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <title>העגלה המשפחתית</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🛒 העגלה המשפחתית</h1>
    <button id="share" type="button">שתף קישור</button>
  </header>

  <main>
    <form id="add-form" autocomplete="off">
      <input id="add-input" type="text" maxlength="80" placeholder="מה חסר בבית?" enterkeyhint="done" required>
      <button type="submit">הוסף</button>
    </form>

    <p id="status" role="status"></p>

    <section>
      <ul id="list"></ul>
    </section>

    <section id="done-section" hidden>
      <h2>בעגלה ✓ <span id="done-count"></span></h2>
      <ul id="done-list"></ul>
      <button id="clear-done" type="button" class="link">נקה את מה שבעגלה</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
